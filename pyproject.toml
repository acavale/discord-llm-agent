[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# Long lines are the existing style here (prompt text and docstrings);
# rewrapping them would be churn, so E501 is not enforced.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Check scripts put the repo root on sys.path before importing the package.
"scripts/*.py" = ["E402"]
